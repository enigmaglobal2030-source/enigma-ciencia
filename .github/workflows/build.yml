name: Compilar sitio

on:
  push:
    branches: [main]
    paths:
      - "build.js"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-sitio
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compilar
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: node build.js
      - name: Guardar cambios generados
        run: |
          git config user.name "enigma-ciencia-site"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Compila el sitio automáticamente"
            git push origin HEAD:main
          fi
