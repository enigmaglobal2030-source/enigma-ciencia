name: Compilar sitio

on:
  push:
    branches: [main]
    paths:
      - "build.js"
      - "data/**"
      - "tailwind.css"
      - "tailwind.config.js"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-sitio
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Generar estilos
        run: npm run css
      - name: Compilar
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: node build.js
      - name: Guardar cambios generados
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          git config user.name "enigma-ciencia-site"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Compila el sitio automáticamente"
          if git push origin HEAD:main; then
            exit 0
          fi
          echo "main cambió mientras compilábamos; reconstruyendo sobre la última versión"
          git fetch origin main
          git reset --hard origin/main
          npm run css
          node build.js
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar tras reconstruir"
            exit 0
          fi
          git commit -m "Compila el sitio automáticamente"
          git push origin HEAD:main
