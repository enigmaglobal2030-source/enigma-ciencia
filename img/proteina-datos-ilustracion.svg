<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ilustración de una cadena de proteína unida a nodos de datos y anotaciones">
  <rect width="960" height="600" fill="#0f172a"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="480" cy="270" r="280" fill="url(#glow)"/>
  <!-- cadena de proteína -->
  <path d="M120 300 C 200 180, 280 380, 360 280 S 520 170, 600 280 S 760 380, 840 260" fill="none" stroke="#7dd3fc" stroke-width="10" stroke-linecap="round"/>
  <g fill="#e0f2fe">
    <circle cx="120" cy="300" r="12"/><circle cx="360" cy="280" r="12"/><circle cx="600" cy="280" r="12"/><circle cx="840" cy="260" r="12"/>
  </g>
  <!-- nodos de anotación -->
  <g stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 8" fill="none">
    <line x1="360" y1="280" x2="360" y2="130"/><line x1="600" y1="280" x2="600" y2="430"/>
  </g>
  <g fill="#0ea5e9" stroke="#bae6fd" stroke-width="3">
    <rect x="310" y="90" width="100" height="50" rx="10"/><rect x="550" y="430" width="100" height="50" rx="10"/>
  </g>
  <text x="360" y="122" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#f8fafc">Literatura</text>
  <text x="600" y="462" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#f8fafc">Datos</text>
  <text x="480" y="520" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Una estructura, más contexto</text>
  <text x="480" y="558" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#cbd5e1">Ilustración original con fines explicativos</text>
</svg>
