<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ilustración de células productoras de insulina con una señal de defensa">
  <rect width="960" height="600" fill="#0f172a"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="480" cy="270" r="280" fill="url(#glow)"/>
  <!-- células productoras de insulina -->
  <g fill="#065f46" stroke="#6ee7b7" stroke-width="4" stroke-opacity="0.8">
    <ellipse cx="300" cy="260" rx="110" ry="85"/>
    <ellipse cx="520" cy="250" rx="100" ry="80"/>
  </g>
  <g fill="#a7f3d0" fill-opacity="0.8">
    <circle cx="270" cy="250" r="9"/><circle cx="310" cy="280" r="7"/><circle cx="290" cy="225" r="6"/>
    <circle cx="500" cy="240" r="8"/><circle cx="535" cy="270" r="6"/>
  </g>
  <!-- señal de defensa -->
  <g fill="#fbbf24" fill-opacity="0.9">
    <circle cx="700" cy="180" r="18"/><circle cx="740" cy="230" r="14"/><circle cx="690" cy="260" r="12"/>
  </g>
  <path d="M660 220 L 630 240" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 8"/>
  <!-- barras descendentes de insulina -->
  <g fill="#34d399" fill-opacity="0.85">
    <rect x="150" y="390" width="40" height="60" rx="6"/>
    <rect x="220" y="390" width="40" height="45" rx="6"/>
    <rect x="290" y="390" width="40" height="34" rx="6"/>
  </g>
  <text x="480" y="520" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Una vacuna antigua, nuevos usos</text>
  <text x="480" y="558" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#cbd5e1">Ilustración original con fines explicativos</text>
</svg>
