<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ilustración de una garrapata con un escudo de protección">
  <rect width="960" height="600" fill="#0f172a"/>
  <!-- garrapata -->
  <g transform="translate(360 260)">
    <ellipse cx="0" cy="0" rx="90" ry="70" fill="#422006" stroke="#fbbf24" stroke-width="4" stroke-opacity="0.8"/>
    <ellipse cx="0" cy="-70" rx="34" ry="28" fill="#422006" stroke="#fbbf24" stroke-width="4" stroke-opacity="0.8"/>
    <g stroke="#fbbf24" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M-70 20 L-130 50"/><path d="M-80 0 L-140 10"/><path d="M-70 -20 L-120 -50"/>
      <path d="M70 20 L130 50"/><path d="M80 0 L140 10"/><path d="M70 -20 L120 -50"/>
    </g>
  </g>
  <!-- escudo -->
  <path d="M700 180 L780 205 L780 290 Q 780 360 700 395 Q 620 360 620 290 L620 205 Z" fill="#0ea5e9" fill-opacity="0.85" stroke="#bae6fd" stroke-width="4"/>
  <text x="700" y="300" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">73 %</text>
  <text x="480" y="520" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Vacuna contra la enfermedad de Lyme</text>
  <text x="480" y="558" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#cbd5e1">Ilustración original con fines explicativos</text>
</svg>
