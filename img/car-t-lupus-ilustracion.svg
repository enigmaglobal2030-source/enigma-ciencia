<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Gráfica de barras con la actividad de lupus antes y seis meses después de células CAR-T">
  <rect width="960" height="600" fill="#0f172a"/>
  <text x="480" y="90" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#cbd5e1">Índice de actividad del lupus (SLEDAI)</text>
  <line x1="200" y1="450" x2="760" y2="450" stroke="#475569" stroke-width="3"/>
  <!-- basal -->
  <rect x="300" y="170" width="150" height="280" rx="10" fill="#be123c"/>
  <text x="375" y="155" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#fecdd3">13,0</text>
  <text x="375" y="490" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#cbd5e1">Basal</text>
  <!-- seis meses -->
  <rect x="520" y="391" width="150" height="59" rx="10" fill="#22d3ee"/>
  <text x="595" y="375" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#a5f3fc">2,2</text>
  <text x="595" y="490" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#cbd5e1">A los seis meses</text>
  <text x="480" y="548" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#cbd5e1">Ilustración original con datos de un análisis presentado en ACR Convergence 2026</text>
</svg>
