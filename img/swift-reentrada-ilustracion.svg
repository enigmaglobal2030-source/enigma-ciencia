<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Órbita terrestre con un satélite que cae hacia la Tierra">
  <rect width="960" height="600" fill="#0f172a"/>
  <!-- Tierra -->
  <circle cx="480" cy="760" r="520" fill="#0c4a6e" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.6"/>
  <!-- órbita -->
  <path d="M120 300 Q 480 40 840 300" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 10"/>
  <!-- satélite -->
  <g transform="translate(330 180) rotate(-20)">
    <rect x="-40" y="-14" width="80" height="28" rx="6" fill="#e2e8f0"/>
    <rect x="-100" y="-10" width="50" height="20" fill="#38bdf8"/>
    <rect x="50" y="-10" width="50" height="20" fill="#38bdf8"/>
  </g>
  <!-- trayectoria de caída -->
  <path d="M330 200 Q 420 300 470 420" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12"/>
  <polygon points="478,438 452,430 470,408" fill="#f97316"/>
  <circle cx="480" cy="450" r="10" fill="#f97316"/>
  <text x="480" y="520" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Un telescopio que cae a la Tierra</text>
  <text x="480" y="558" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#cbd5e1">Ilustración original con fines explicativos</text>
</svg>
