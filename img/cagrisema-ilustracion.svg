<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Gráfica de barras con la pérdida de peso a 68 semanas con CagriSema y con placebo">
  <rect width="960" height="600" fill="#0f172a"/>
  <text x="480" y="90" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#cbd5e1">Pérdida media de peso a las 68 semanas (análisis de eficacia)</text>
  <line x1="200" y1="450" x2="760" y2="450" stroke="#475569" stroke-width="3"/>
  <rect x="300" y="404" width="150" height="46" rx="10" fill="#475569"/>
  <text x="375" y="388" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#e2e8f0">2,0 %</text>
  <text x="375" y="490" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#cbd5e1">Placebo</text>
  <rect x="520" y="210" width="150" height="240" rx="10" fill="#f97316"/>
  <text x="595" y="193" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#fed7aa">21,0 %</text>
  <text x="595" y="490" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#cbd5e1">CagriSema 1,0/1,0 mg</text>
  <text x="480" y="548" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#cbd5e1">Ilustración original con cifras preliminares de la empresa Novo Nordisk</text>
</svg>
