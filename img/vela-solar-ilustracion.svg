<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ilustración de una vela solar empujada por fotones de luz">
  <rect width="960" height="600" fill="#0f172a"/>
  <circle cx="110" cy="130" r="90" fill="#f59e0b" fill-opacity="0.35"/>
  <circle cx="110" cy="130" r="50" fill="#fde68a"/>
  <!-- fotones -->
  <g stroke="#fde68a" stroke-width="4" stroke-linecap="round" fill="none" stroke-opacity="0.85">
    <line x1="200" y1="110" x2="300" y2="110"/><line x1="200" y1="180" x2="300" y2="180"/>
    <line x1="200" y1="250" x2="300" y2="250"/><line x1="200" y1="320" x2="300" y2="320"/>
  </g>
  <!-- vela -->
  <g transform="translate(560 260) rotate(-12)">
    <rect x="-120" y="-150" width="30" height="300" fill="#e2e8f0" fill-opacity="0.9" stroke="#94a3b8" stroke-width="3"/>
    <rect x="-80" y="-170" width="30" height="340" fill="#e2e8f0" fill-opacity="0.9" stroke="#94a3b8" stroke-width="3"/>
    <rect x="-40" y="-160" width="30" height="320" fill="#e2e8f0" fill-opacity="0.9" stroke="#94a3b8" stroke-width="3"/>
    <rect x="0" y="-150" width="30" height="300" fill="#e2e8f0" fill-opacity="0.9" stroke="#94a3b8" stroke-width="3"/>
    <rect x="-60" y="-20" width="120" height="40" rx="8" fill="#334155"/>
  </g>
  <!-- empuje -->
  <g stroke="#38bdf8" stroke-width="6" stroke-linecap="round">
    <line x1="520" y1="260" x2="620" y2="330"/>
  </g>
  <polygon points="632,340 606,334 620,314" fill="#38bdf8"/>
  <text x="480" y="520" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">La luz empuja la vela</text>
  <text x="480" y="558" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#cbd5e1">Ilustración original con fines explicativos</text>
</svg>
