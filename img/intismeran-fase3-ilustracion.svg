<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Gráfica de barras con la supervivencia libre de recaída a dos años con y sin vacuna">
  <rect width="960" height="600" fill="#0f172a"/>
  <text x="480" y="90" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#cbd5e1">Supervivencia libre de recaída a dos años</text>
  <!-- ejes -->
  <line x1="200" y1="450" x2="760" y2="450" stroke="#475569" stroke-width="3"/>
  <!-- barra sin vacuna -->
  <rect x="300" y="250" width="150" height="200" rx="10" fill="#475569"/>
  <text x="375" y="235" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#e2e8f0">70,0 %</text>
  <text x="375" y="490" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#cbd5e1">Solo pembrolizumab</text>
  <!-- barra con vacuna -->
  <rect x="520" y="182" width="150" height="268" rx="10" fill="#a855f7"/>
  <text x="595" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#f5d0fe">82,2 %</text>
  <text x="595" y="490" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#cbd5e1">Con vacuna</text>
  <text x="480" y="548" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#cbd5e1">Ilustración original con datos del ensayo de fase 3 reportados en ESMO 2026</text>
</svg>
