<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ilustración de un globo con líneas que salen de Shanghái hacia otros países">
  <rect width="960" height="600" fill="#0f172a"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="480" cy="270" r="260" fill="url(#glow)"/>
  <!-- globo -->
  <circle cx="480" cy="270" r="200" fill="#082f49" stroke="#22d3ee" stroke-width="3" stroke-opacity="0.6"/>
  <g fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.3">
    <ellipse cx="480" cy="270" rx="200" ry="70"/>
    <ellipse cx="480" cy="270" rx="200" ry="140"/>
    <ellipse cx="480" cy="270" rx="90" ry="200"/>
    <line x1="280" y1="270" x2="680" y2="270"/>
    <line x1="480" y1="70" x2="480" y2="470"/>
  </g>
  <!-- rutas -->
  <g fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M610 230 Q 540 120 360 140"/>
    <path d="M610 230 Q 680 330 760 380"/>
    <path d="M610 230 Q 520 360 330 400"/>
    <path d="M610 230 Q 620 140 720 110"/>
    <path d="M610 230 Q 470 210 300 250"/>
  </g>
  <!-- destinos -->
  <g fill="#fbbf24" fill-opacity="0.85">
    <circle cx="360" cy="140" r="9"/><circle cx="760" cy="380" r="9"/>
    <circle cx="330" cy="400" r="9"/><circle cx="720" cy="110" r="9"/><circle cx="300" cy="250" r="9"/>
  </g>
  <!-- Shanghái -->
  <circle cx="610" cy="230" r="34" fill="#f59e0b" fill-opacity="0.25"/>
  <circle cx="610" cy="230" r="14" fill="#f59e0b"/>
  <text x="640" y="236" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#fde68a">Shanghái</text>
  <text x="480" y="520" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Pacientes que viajan para recibir CAR-T</text>
  <text x="480" y="558" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#cbd5e1">Ilustración original; ubicaciones simbólicas, no geográficas</text>
</svg>
