<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ilustración de una doble hélice de ADN conectada con varios tipos de célula">
  <rect width="960" height="600" fill="#0f172a"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="480" cy="270" r="280" fill="url(#glow)"/>
  <!-- doble hélice -->
  <path d="M300 70 C 360 130, 240 190, 300 250 S 240 370, 300 420 S 340 450, 320 470" fill="none" stroke="#6ee7b7" stroke-width="7" stroke-linecap="round"/>
  <path d="M340 70 C 280 130, 400 190, 340 250 S 400 370, 340 420 S 300 450, 310 470" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-opacity="0.8"/>
  <g stroke="#a7f3d0" stroke-width="4" stroke-opacity="0.7">
    <line x1="290" y1="110" x2="350" y2="110"/><line x1="265" y1="190" x2="375" y2="190"/>
    <line x1="265" y1="300" x2="375" y2="300"/><line x1="290" y1="410" x2="350" y2="410"/>
  </g>
  <!-- tipos de célula -->
  <circle cx="620" cy="160" r="62" fill="#065f46" stroke="#6ee7b7" stroke-width="4"/>
  <circle cx="780" cy="290" r="62" fill="#0e7490" stroke="#67e8f9" stroke-width="4"/>
  <circle cx="620" cy="420" r="62" fill="#4c1d95" stroke="#c4b5fd" stroke-width="4"/>
  <g fill="#f8fafc" fill-opacity="0.8">
    <circle cx="610" cy="150" r="7"/><circle cx="640" cy="175" r="5"/>
    <circle cx="775" cy="280" r="7"/><circle cx="800" cy="305" r="5"/>
    <circle cx="615" cy="410" r="7"/><circle cx="640" cy="432" r="5"/>
  </g>
  <g stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 8" fill="none">
    <path d="M360 300 C 450 300, 500 240, 556 175"/>
    <path d="M360 300 C 480 300, 600 300, 716 290"/>
    <path d="M360 300 C 450 330, 500 390, 556 415"/>
  </g>
  <text x="480" y="520" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Una variante genética, distintos efectos</text>
  <text x="480" y="558" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#cbd5e1">Ilustración original con fines explicativos</text>
</svg>
